name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e src/python
      - name: Unit tests
        run: python -m unittest discover -s src/python/tests -v
      - name: Built-in self-test
        run: python -m crlab selftest
      - name: Paired smoke test
        run: python -m crlab paired --target 3 4 --trials 500 --lo -5 --hi 5

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (C++17)
        run: g++ -std=c++17 -O2 -Wall -Wextra -o cr src/cpp/controlled_randomness.cpp
      - name: Built-in self-test
        run: ./cr --self-test
      - name: Paired smoke test
        run: ./cr --arm both --target 3 4 --trials 500 --lo -5 --hi 5
